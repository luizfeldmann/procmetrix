on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Check style for C/C++ sources
      - name: clang-format (check)
        id: clang-format-check
        if: always()
        run: |
          find src include tests bindings \
          \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' \) \
          -exec clang-format --style=file --dry-run --Werror {} +

      - name: clang-format (fix)
        if: failure() && steps.clang-format-check.outcome == 'failure'
        run: |
          find src include tests bindings \
          \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' \) \
          -exec clang-format --style=file -i {} +

      # Install checks depends
      - name: pip install
        if: always()
        run: pip install --upgrade pip && pip install "conan" "ruff"

      # Check style for Python bindings
      - name: ruff (check)
        id: ruff-check
        if: always()
        run: |
          ruff check .
          ruff format --check .

      - name: ruff (fix)
        if: failure() && steps.ruff-check.outcome == 'failure'
        run: |
          ruff check . --fix
          ruff format .

      # If any linter failed, show the diffs
      - name: Preview fixes
        if: failure()
        run: git diff

      # Check all the packages have the same version number
      - name: version check
        if: always()
        run: |
          CONAN_VERSION=$(conan inspect . --format=json | jq -r .version)
          PYTHON_VERSION=$(yq -r '.project.version' pyproject.toml)
          NODEJS_VERSION=$(jq -r .version package.json)

          if [ "$CONAN_VERSION" != "$PYTHON_VERSION" ] || \
             [ "$CONAN_VERSION" != "$NODEJS_VERSION" ]; then
            echo "Version mismatch:"
            echo " Conan: $CONAN_VERSION"
            echo " Python: $PYTHON_VERSION"
            echo " NodeJS: $NODEJS_VERSION"
            exit 1
          fi
