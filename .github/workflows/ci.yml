# Trigger conditions
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel competing runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Linter
  lint:
    uses: ./.github/workflows/linter.yml
    permissions:
      contents: read

  # Documentation
  docs-generate:
    uses: ./.github/workflows/docs-generate.yml
    permissions:
      contents: read

  # Linux builds
  linux-release:
    uses: ./.github/workflows/build-linux.yml
    permissions:
      contents: read
    with:
      conan-profile: linux-release
      export-pkg: true

  linux-debug:
    uses: ./.github/workflows/build-linux.yml
    permissions:
      contents: read
    with:
      conan-profile: linux-debug
      export-pkg: true

  linux-clang-cov-san:
    uses: ./.github/workflows/build-linux.yml
    permissions:
      contents: read
    with:
      conan-profile: linux-clang-cov-san
      clang-tidy: true
      coverage: true

  # Windows builds
  windows-release:
    uses: ./.github/workflows/build-windows.yml
    permissions:
      contents: read
    with:
      conan-profile: windows-release
      export-pkg: true

  windows-debug:
    uses: ./.github/workflows/build-windows.yml
    permissions:
      contents: read
    with:
      conan-profile: windows-debug
      export-pkg: true

  windows-clang-cov-san:
    uses: ./.github/workflows/build-windows.yml
    permissions:
      contents: read
    with:
      conan-profile: windows-clang-cov-san
      coverage: true
      clang-tidy: true

  # FreeBSD builds
  freebsd-release:
    uses: ./.github/workflows/build-freebsd.yml
    permissions:
      contents: read
    with:
      conan-profile: freebsd-release
      export-pkg: true

  freebsd-debug-cov-san:
    uses: ./.github/workflows/build-freebsd.yml
    permissions:
      contents: read
    with:
      conan-profile: freebsd-debug-cov-san
      coverage: true
      clang-tidy: true

  # Combine reports
  combine-coverage:
    uses: ./.github/workflows/combine-coverage.yml
    permissions:
      contents: read
    needs:
      - linux-clang-cov-san
      - windows-clang-cov-san
      - freebsd-debug-cov-san

  # Build python wheels
  linux-python-wheels:
    uses: ./.github/workflows/build-python-wheels.yml
    permissions:
      contents: read
    with:
      runs-on: ubuntu-latest
    needs:
      - linux-release

  windows-python-wheels:
    uses: ./.github/workflows/build-python-wheels.yml
    permissions:
      contents: read
    with:
      runs-on: windows-latest
    needs:
      - windows-release

  freebsd-python-wheels:
    uses: ./.github/workflows/build-python-wheels-freebsd.yml
    permissions:
      contents: read
    needs:
      - freebsd-release

  # Publish Doxygen as GitHub Pages
  docs-publish:
    # Only when updating main
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs:
      # Require checks to pass
      - lint
      - docs-generate
      - combine-coverage

      # Requires all builds to pass
      - linux-release
      - linux-debug
      - linux-clang-cov-san

      - windows-release
      - windows-debug
      - windows-clang-cov-san

      - freebsd-release
      - freebsd-debug-cov-san

      # Require Python bindings to pass
      - linux-python-wheels
      - windows-python-wheels
      - freebsd-python-wheels

    uses: ./.github/workflows/docs-publish.yml

    permissions:
      contents: read
      pages: write
      id-token: write
