on:
  workflow_call:
    inputs:
      conan-profile:
        type: string
        required: true
      coverage:
        type: boolean
        required: false
        default: false
      clang-tidy:
        type: boolean
        required: false
        default: false

jobs:
  linux-build-and-test:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            git \
            build-essential \
            gcovr \
            cmake \
            clang \
            clang-tidy \
            python3 \
            python3-pip \
            python3-venv

      - name: Setup Python
        run: |
          python3 -m venv venv
          echo "$PWD/venv/bin" >> $GITHUB_PATH

      - name: Setup Conan
        run: |
          pip install --upgrade pip
          pip install conan
          conan profile detect --force

      - name: Build
        run: conan build . --build=missing --profile=conan/profiles/${{inputs.conan-profile}}

      - name: clang-tidy
        if: inputs.clang-tidy
        run: run-clang-tidy -quiet -p "$(find build -name compile_commands.json -printf '%h\n' | head -n1)"

      - name: Coverage
        if: inputs.coverage
        run: |
          mkdir -p coverage
          gcovr --root . --filter "^src/" --cobertura coverage/cobertura.xml --html-details coverage/index.html

      - name: Upload coverage
        if: inputs.coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{inputs.conan-profile}}
          path: coverage

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{inputs.conan-profile}}
          path: build/**/test-results*.xml
