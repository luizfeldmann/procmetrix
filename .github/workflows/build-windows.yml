on:
  workflow_call:
    inputs:
      conan-profile:
        type: string
        required: true
      coverage:
        type: boolean
        required: false
        default: false
      clang-tidy:
        type: boolean
        required: false
        default: false
      export-pkg:
        type: boolean
        required: false
        default: false

jobs:
  windows-build-and-test:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v6

      - name: Setup Conan
        run: |
          pip install --upgrade pip
          pip install conan
          conan profile detect --force

      - name: Build
        run: conan build . --build=missing --profile=conan\profiles\${{inputs.conan-profile}}

      - name: Export
        if: inputs.export-pkg
        shell: pwsh
        run: |
          conan export-pkg . --profile=conan\profiles\${{inputs.conan-profile}}

          $conanInspect = conan inspect . --format=json | ConvertFrom-Json
          $packageRef = "$($conanInspect.name)/$($conanInspect.version)"

          $conanProfile = conan profile show --format=json --profile=conan\profiles\${{ inputs.conan-profile }} | ConvertFrom-Json
          $packageFile = "$($conanInspect.name)-$($conanInspect.version)-$($conanProfile.host.settings.os)-$($conanProfile.host.settings.arch)-$($conanProfile.host.settings.compiler)-$($conanProfile.host.settings.'compiler.version')-$($conanProfile.host.settings.build_type)"
          
          New-Item -ItemType Directory -Path dist -Force > $null
          conan cache save --file="dist/$packageFile.tgz" "$($packageRef):*"

      - name: clang-tidy
        if: inputs.clang-tidy
        shell: pwsh
        run: |
          $runClangTidy = (Get-Command run-clang-tidy).Source
          $compileDbDir = (Get-ChildItem build -Recurse -Filter compile_commands.json | Select-Object -First 1).Directory.FullName
          python $runClangTidy -quiet -j $env:NUMBER_OF_PROCESSORS -p $compileDbDir

      - name: Coverage
        if: inputs.coverage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path coverage | Out-Null

          $profraws = Get-ChildItem build -Recurse -Filter *.profraw | Select-Object -ExpandProperty FullName
          $unitTests = $unitTests = Get-ChildItem build -Recurse -Filter unitTests.exe | Select-Object -First 1 -ExpandProperty FullName

          llvm-profdata merge -sparse $profraws -o coverage\coverage.profdata
          llvm-cov export -format=lcov -instr-profile="coverage\coverage.profdata" $unitTests src > "coverage\coverage.lcov"
          llvm-cov show -format=html -instr-profile="coverage\coverage.profdata" --output-dir=coverage $unitTests src

          $root = [regex]::Escape((Get-Location).Path)
          (Get-Content "coverage/coverage.lcov") -replace "^SF:$root[\\/]", 'SF:' -replace '\\', '/' | Set-Content "coverage/coverage.lcov"

      - name: Upload coverage
        if: inputs.coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{inputs.conan-profile}}
          path: coverage

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{inputs.conan-profile}}
          path: build/**/test-results*.xml

      - name: Upload conan package
        if: inputs.export-pkg
        uses: actions/upload-artifact@v4
        with:
          name: conan-package-${{inputs.conan-profile}}
          path: dist/*.tgz
